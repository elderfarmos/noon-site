name: Update Noon Trending

on:
  schedule:
    - cron: "0 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:         # يسمح بتشغيله يدوياً من تبويب Actions للاختبار

permissions:
  contents: write            # ضروري عشان يقدر يعمل commit/push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"   # LTS حالي - بيلغي تحذير Node 20 نهائياً

      - name: Run fetch-noon script
        run: node scripts/fetch-noon.js

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/noon-trending.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في البيانات - تخطي الـ commit"
          else
            git commit -m "chore: update noon trending data [skip ci]"
            git push
          fi

name: Update Noon Trending
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-noon-trending.js
      - name: Commit changes
        run: |
          git config --global user.name 'bot'
          git config --global user.email 'bot@github.com'
          git add data/noon-trending.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update trending"
          git push
